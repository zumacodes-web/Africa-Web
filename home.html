    <style>
        :root {
            --black: #0b0b0d;
            --white: #ffffff;
            --accent-gold: #ffbf5e;
            --accent-gold-hover: #ffca7b;
            --primary-brown: #8b2626;
            --primary-brown-hover: #a53030;
            --font-heading: "Archivo Black", sans-serif;
            --font-body: "Libre Baskerville", serif;
            --font-mono: "IBM Plex Mono", monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--black);
            background-image: linear-gradient(rgba(11, 11, 13, 0.75), rgba(11, 11, 13, 0.85)), url('img/bg2.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: var(--font-body);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 3.5rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            margin-bottom: 40px;
        }

        .cards-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            margin-bottom: 40px;
        }

        /* Interactive Flip Card */
        .card {
            width: 190px;
            height: 254px;
            background: var(--accent-gold);
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.4s ease, box-shadow 0.4s ease, background-color 0.4s ease;
        }

        .card:hover {
            transform: translateY(-5px) scale(1.05);
            background: var(--accent-gold-hover);
            box-shadow: 0 15px 35px rgba(255, 191, 94, 0.3);
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .first-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            transition: all 0.4s ease;
            opacity: 1;
        }

        .imgcard {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .card:hover .first-content {
            opacity: 0;
            transform: scale(0.9);
        }

        .second-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            color: var(--black);
            font-family: var(--font-heading);
            font-size: 1.3rem;
            opacity: 0;
            transform: rotate(-10deg) scale(0.8);
            transition: all 0.4s ease;
        }

        .card:hover .second-content {
            opacity: 1;
            transform: rotate(0deg) scale(1);
        }

        button {
            background-color: var(--primary-brown);
            color: var(--white);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            font-weight: 600;
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(139, 38, 38, 0.4);
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-brown-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 38, 38, 0.6);
        }

        hr {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            width: 100%;
            margin: 20px 0;
        }

        .copyright {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: #b0b0b0;
            line-height: 1.6;
            text-transform: capitalize;
        }

        /* Responsive Layout */
        @media (max-width: 768px) {
            .container {
                padding: 30px 15px;
            }
            h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
